[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceeval"
version = "0.1.0"
description = "TRACE-Eval: change-aware, cost-bounded regression test selection for LLM agent systems - a research testbed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ciprian Paduraru" }]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "coverage>=7.4",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
otel = ["opentelemetry-sdk>=1.25"]
ml = ["scikit-learn>=1.4"]
sdd = ["hypothesis>=6.100", "z3-solver>=4.12"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "z3-solver>=4.12"]

[project.scripts]
traceeval = "traceeval.cli:main"

[tool.setuptools.packages.find]
include = ["traceeval*"]

[tool.setuptools.package-data]
traceeval = ["sut/**/*.md", "sut/**/*.yaml", "sut/**/*.json", "catalog/**/*.yaml", "specs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end experiment (seconds)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"traceeval/mutation/catalog.py" = ["E501"]
"traceeval/spec/prs.py" = ["E501"]

[tool.ruff.format]
exclude = ["traceeval/mutation/catalog.py", "traceeval/spec/prs.py"]
