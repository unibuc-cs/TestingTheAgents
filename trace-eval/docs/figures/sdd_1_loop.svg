<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="From a prose request to a verdict: the person writes and confirms, the model drafts within the catalog and the product model, the machine checks the PR and produces the evidence." font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>

  <!-- lanes -->
  <rect x="20" y="20" width="1060" height="140" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1066" y="44" text-anchor="end" font-size="15" font-weight="bold" fill="#9a3412">PERSON — owner, reviewer</text>
  <rect x="20" y="180" width="1060" height="130" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1066" y="204" text-anchor="end" font-size="15" font-weight="bold" fill="#5b21b6">MODEL — any OpenAI-compatible endpoint</text>
  <rect x="20" y="330" width="1060" height="170" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1066" y="354" text-anchor="end" font-size="15" font-weight="bold" fill="#1e40af">MACHINE — traceeval sdd</text>

  <!-- person: request -->
  <rect x="40" y="70" width="170" height="70" rx="6" fill="#ffffff" stroke="#9a3412"/>
  <text x="125" y="98" text-anchor="middle" font-weight="bold">writes the request</text>
  <text x="125" y="118" text-anchor="middle" font-size="13">request.md (prose)</text>

  <!-- person: review -->
  <rect x="470" y="70" width="190" height="70" rx="6" fill="#ffffff" stroke="#9a3412"/>
  <text x="565" y="98" text-anchor="middle" font-weight="bold">reviews the draft</text>
  <text x="565" y="118" text-anchor="middle" font-size="13">edits slots, raises require</text>

  <!-- person: confirmed spec -->
  <rect x="720" y="70" width="150" height="70" rx="6" fill="#ffffff" stroke="#9a3412"/>
  <text x="795" y="98" text-anchor="middle" font-weight="bold">confirms</text>
  <text x="795" y="118" text-anchor="middle" font-size="13">FS-0106.yaml</text>

  <!-- person: decides -->
  <rect x="900" y="70" width="160" height="70" rx="6" fill="#ffffff" stroke="#9a3412"/>
  <text x="980" y="98" text-anchor="middle" font-weight="bold">reads the evidence</text>
  <text x="980" y="118" text-anchor="middle" font-size="13">merges, or acts on gaps</text>

  <!-- model: draft -->
  <rect x="240" y="225" width="200" height="70" rx="6" fill="#ffffff" stroke="#5b21b6"/>
  <text x="340" y="253" text-anchor="middle" font-weight="bold">drafts clauses</text>
  <text x="340" y="273" text-anchor="middle" font-size="13">answers template + slots only</text>

  <!-- machine: inputs to the model -->
  <rect x="40" y="380" width="160" height="56" rx="6" fill="#ffffff" stroke="#1e40af"/>
  <text x="120" y="403" text-anchor="middle" font-weight="bold">clause catalog</text>
  <text x="120" y="421" text-anchor="middle" font-size="13">16 templates</text>
  <path d="M120,436 L120,444" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="40" y="444" width="160" height="50" rx="6" fill="#ffffff" stroke="#1e40af"/>
  <text x="120" y="465" text-anchor="middle" font-weight="bold">product model</text>
  <text x="120" y="483" text-anchor="middle" font-size="13">tools, keys, skills, runs</text>

  <!-- machine: expand + validate -->
  <rect x="240" y="380" width="200" height="70" rx="6" fill="#ffffff" stroke="#1e40af"/>
  <text x="340" y="403" text-anchor="middle" font-weight="bold">expands and validates</text>
  <text x="340" y="421" text-anchor="middle" font-size="13">unknown name = error</text>
  <text x="340" y="439" text-anchor="middle" font-size="13">new name = note</text>

  <!-- machine: check PR -->
  <rect x="720" y="380" width="150" height="110" rx="6" fill="#ffffff" stroke="#1e40af"/>
  <text x="795" y="403" text-anchor="middle" font-weight="bold">checks the PR</text>
  <text x="795" y="423" text-anchor="middle" font-size="13">copy app, apply edits</text>
  <text x="795" y="441" text-anchor="middle" font-size="13">run every clause</text>
  <text x="795" y="459" text-anchor="middle" font-size="13">run selected regression</text>
  <text x="795" y="477" text-anchor="middle" font-size="13">verdict</text>

  <!-- the PR -->
  <rect x="520" y="400" width="140" height="56" rx="6" fill="#ffffff" stroke="#1e40af" stroke-dasharray="5 3"/>
  <text x="590" y="423" text-anchor="middle" font-weight="bold">the PR</text>
  <text x="590" y="441" text-anchor="middle" font-size="13">file edits (any author)</text>

  <!-- evidence -->
  <rect x="900" y="400" width="160" height="56" rx="6" fill="#ffffff" stroke="#1e40af"/>
  <text x="980" y="423" text-anchor="middle" font-weight="bold">evidence record</text>
  <text x="980" y="441" text-anchor="middle" font-size="13">per clause: status, rung</text>

  <!-- arrows -->
  <!-- request -> model -->
  <path d="M210,105 L300,105 L300,225" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="222" y="98" font-size="13">prose</text>
  <!-- catalog + model -> model -->
  <path d="M120,380 L120,260 L240,260" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="180" y="252" font-size="13" text-anchor="middle">templates + names</text>
  <!-- model -> expand -->
  <path d="M340,295 L340,380" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="348" y="342" font-size="13">JSON: use + with</text>
  <!-- expand -> review -->
  <path d="M440,415 L470,415 L470,140" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="478" y="300" font-size="13">FS-0106.draft.yaml</text>
  <text x="478" y="318" font-size="13">+ plain-language rendering</text>
  <!-- review -> confirm -->
  <path d="M660,105 L720,105" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- confirm -> check -->
  <path d="M795,140 L795,380" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="787" y="330" font-size="13" text-anchor="end">the confirmed spec</text>
  <!-- PR -> check -->
  <path d="M660,428 L720,428" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- product model -> check (dynamic facts) -->
  <path d="M120,494 L120,510 L795,510 L795,490" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="458" y="505" font-size="12" text-anchor="middle" fill="#4b5563">rebuilt from the PR's tree + the recorded runs</text>
  <!-- check -> evidence -->
  <path d="M870,428 L900,428" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- evidence -> person -->
  <path d="M980,400 L980,140" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="972" y="250" font-size="13" text-anchor="end">report.md</text>
  <text x="972" y="268" font-size="13" text-anchor="end">accepted / with gaps / rejected</text>
</svg>
