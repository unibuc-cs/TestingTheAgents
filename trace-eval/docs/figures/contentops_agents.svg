<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 774" width="1100" height="774" role="img" aria-label="ContentOps: a user request goes to the orchestrator, which delegates it to one specialist agent, or plans the steps of a request that needs several and delegates them in turn, asking a person before publishing; each specialist follows its skill's procedure, and every tool call passes through the dispatcher's gates into tool adapters, services and the state." font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1100" height="774" fill="#ffffff"/>

  <!-- user -->
  <rect x="40" y="30" width="230" height="74" rx="6" fill="#fff7ed" stroke="#9a3412"/>
  <text x="155" y="60" text-anchor="middle" font-weight="bold" font-size="13">a user of the platform</text>
  <text x="155" y="80" text-anchor="middle" font-size="12">"Please publish the welcome page"</text>

  <!-- orchestrator -->
  <rect x="330" y="30" width="440" height="74" rx="6" fill="#f5f3ff" stroke="#5b21b6"/>
  <text x="550" y="52" text-anchor="middle" font-weight="bold">orchestrator — skill: routing</text>
  <text x="550" y="72" text-anchor="middle" font-size="12">one specialist owns it: delegates once (route_to_agent)</text>
  <text x="550" y="90" text-anchor="middle" font-size="12">several: make_plan, a step at a time, request_approval before publishing</text>
  <path d="M270,67 L330,67" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="57" text-anchor="middle" font-size="11">request</text>

  <!-- backend -->
  <rect x="830" y="30" width="250" height="74" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="5 3"/>
  <text x="955" y="60" text-anchor="middle" font-weight="bold" font-size="13">backend — drives every agent</text>
  <text x="955" y="80" text-anchor="middle" font-size="12">a model (Gemma, Qwen) or its recorded answers</text>
  <path d="M830,67 L770,67" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- fan-out to the specialists: a bus above each row -->
  <path d="M550,104 L550,118" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M963,118 L30,118 L30,249 L963,249" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <text x="560" y="112" font-size="12">one specialist (else the default agent), or each step of a plan in turn</text>
  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M137,118 L137,140"/><path d="M344,118 L344,140"/><path d="M550,118 L550,140"/>
    <path d="M756,118 L756,140"/><path d="M963,118 L963,140"/>
    <path d="M137,249 L137,262"/><path d="M344,249 L344,262"/><path d="M550,249 L550,262"/>
    <path d="M756,249 L756,262"/><path d="M963,249 L963,262"/>
  </g>

  <!-- specialists: boxes 190 wide, centres 137, 344, 550, 756, 963; two rows -->
  <g font-size="12">
    <rect x="42" y="140" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="137" y="160" text-anchor="middle" font-weight="bold" font-size="13">authoring</text>
    <text x="137" y="178" text-anchor="middle">page-authoring</text>
    <text x="137" y="196" text-anchor="middle">create_page</text>
    <text x="137" y="211" text-anchor="middle">update_page_content</text>
    <text x="137" y="226" text-anchor="middle">set_page_metadata</text>

    <rect x="249" y="140" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="344" y="160" text-anchor="middle" font-weight="bold" font-size="13">publishing</text>
    <text x="344" y="178" text-anchor="middle">publishing-workflow</text>
    <text x="344" y="196" text-anchor="middle">publish_page</text>
    <text x="344" y="211" text-anchor="middle">schedule_publish</text>
    <text x="344" y="226" text-anchor="middle">unpublish_page †</text>

    <rect x="455" y="140" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="550" y="160" text-anchor="middle" font-weight="bold" font-size="13">seo</text>
    <text x="550" y="178" text-anchor="middle">seo-metadata</text>
    <text x="550" y="196" text-anchor="middle">get_seo_report</text>
    <text x="550" y="211" text-anchor="middle">set_page_metadata</text>

    <rect x="661" y="140" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="756" y="160" text-anchor="middle" font-weight="bold" font-size="13">assets</text>
    <text x="756" y="178" text-anchor="middle">asset-management</text>
    <text x="756" y="196" text-anchor="middle">upload_asset</text>
    <text x="756" y="211" text-anchor="middle">search_assets</text>
    <text x="756" y="226" text-anchor="middle">attach_asset</text>

    <rect x="868" y="140" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="963" y="160" text-anchor="middle" font-weight="bold" font-size="13">translation</text>
    <text x="963" y="178" text-anchor="middle">translation</text>
    <text x="963" y="196" text-anchor="middle">create_translation_job</text>
    <text x="963" y="211" text-anchor="middle">get_translation_status</text>

    <rect x="42" y="262" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="137" y="282" text-anchor="middle" font-weight="bold" font-size="13">governance</text>
    <text x="137" y="300" text-anchor="middle">governance-ops</text>
    <text x="137" y="318" text-anchor="middle">check_consent</text>
    <text x="137" y="333" text-anchor="middle">export_user_data †</text>
    <text x="137" y="348" text-anchor="middle">get_audit_log</text>

    <rect x="249" y="262" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="344" y="282" text-anchor="middle" font-weight="bold" font-size="13">maintenance</text>
    <text x="344" y="300" text-anchor="middle">rollback</text>
    <text x="344" y="318" text-anchor="middle">list_versions</text>
    <text x="344" y="333" text-anchor="middle">rollback_page</text>

    <rect x="455" y="262" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="550" y="282" text-anchor="middle" font-weight="bold" font-size="13">brand</text>
    <text x="550" y="300" text-anchor="middle">brand-governance</text>
    <text x="550" y="318" text-anchor="middle">check_brand_policy</text>
    <text x="550" y="333" text-anchor="middle">get_brand_guidelines</text>
    <text x="550" y="348" text-anchor="middle">search_pages</text>

    <rect x="661" y="262" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="756" y="282" text-anchor="middle" font-weight="bold" font-size="13">insights</text>
    <text x="756" y="300" text-anchor="middle">data-insights</text>
    <text x="756" y="318" text-anchor="middle">get_page_metrics</text>

    <rect x="868" y="262" width="190" height="96" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="963" y="282" text-anchor="middle" font-weight="bold" font-size="13">optimizer</text>
    <text x="963" y="300" text-anchor="middle">site-optimization</text>
    <text x="963" y="318" text-anchor="middle">audit_site</text>
    <text x="963" y="333" text-anchor="middle">fix_alt_text</text>
  </g>
  <text x="1058" y="374" text-anchor="end" font-size="11" fill="#4b5563">each box: agent · entry skill · its main tools · † = guarded, needs an approval token</text>

  <!-- shared skills -->
  <rect x="42" y="390" width="1016" height="62" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="56" y="408" font-size="13" font-weight="bold">shared skills, included by the specialists' procedures</text>
  <text x="56" y="426" font-size="12">governance-checks → check_permission before any write (every specialist that changes something)</text>
  <text x="56" y="443" font-size="12">link-validation → validate_links before publishing or scheduling, after an edit or a rollback (authoring, publishing, maintenance)</text>

  <!-- every tool call goes through the dispatcher -->
  <path d="M550,452 L550,480" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="560" y="472" font-size="12">every tool call an agent makes</text>

  <!-- dispatcher -->
  <rect x="42" y="480" width="1016" height="88" rx="6" fill="#eff6ff" stroke="#1e40af"/>
  <text x="56" y="500" font-size="13" font-weight="bold">dispatcher — the one gate every tool call passes (harness/dispatcher.py)</text>
  <g font-size="12">
    <text x="56" y="522">known, enabled tool? → allowed for this agent? → guarded tool: approval token present? → arguments fit the tool? →</text>
    <text x="56" y="539">run it, with fault injection (test profiles) and retries of transient failures; write tools get an idempotency key →</text>
    <text x="56" y="556">trace event tool.call: args, attempts, key and status (ok, error when refused or failed, crash when tool or service code raised)</text>
  </g>

  <!-- tools -> services -> state -->
  <path d="M550,568 L550,594" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="12">
    <rect x="42" y="594" width="320" height="80" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="202" y="614" text-anchor="middle" font-weight="bold" font-size="13">tools — thin adapters (tools/*.py)</text>
    <text x="202" y="632" text-anchor="middle">name, kind (read / write / guarded), JSON schema;</text>
    <text x="202" y="648" text-anchor="middle">hand the call to the service that owns the rule</text>

    <path d="M362,634 L390,634" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="390" y="594" width="320" height="80" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="550" y="614" text-anchor="middle" font-weight="bold" font-size="13">services — the business rules (services/*.py)</text>
    <text x="550" y="632" text-anchor="middle">repository, workflow, links, seo, permissions,</text>
    <text x="550" y="648" text-anchor="middle">governance and approvals, translation,</text>
    <text x="550" y="664" text-anchor="middle">brand, site (analytics, site audit)</text>

    <path d="M710,634 L738,634" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="738" y="594" width="320" height="80" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="898" y="614" text-anchor="middle" font-weight="bold" font-size="13">state — in memory (fixtures/base.json)</text>
    <text x="898" y="632" text-anchor="middle">users, pages with versions and links, assets,</text>
    <text x="898" y="648" text-anchor="middle">consents, translation jobs, brand rules, analytics,</text>
    <text x="898" y="664" text-anchor="middle">the approver, audit log, idempotency memory</text>
  </g>

  <!-- config -->
  <rect x="42" y="694" width="1016" height="50" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="56" y="714" font-size="13" font-weight="bold">config/runtime.yaml — read by the harness, the skills and the tools</text>
  <text x="56" y="732" font-size="12">step budgets (per agent, per request) · retries, idempotency keys · disabled and guarded tools · default agent · review and scheduling · SEO · locales · slow pages</text>
</svg>
