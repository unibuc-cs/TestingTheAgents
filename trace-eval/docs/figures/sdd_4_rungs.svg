<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="The assurance ladder from L0 reviewed to L5 proven with what the evidence at each rung covers, and how a PR's verdict is computed: each clause's reached rung is compared with its required rung; a failing clause rejects, a clause below its required rung is a gap." font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <rect width="1100" height="470" fill="#ffffff"/>

  <!-- the ladder (left) -->
  <text x="40" y="36" font-size="15" font-weight="bold">The rung a check reaches = how much the evidence covers</text>
  <line x1="60" y1="60" x2="60" y2="420" stroke="#9ca3af" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="420" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="13">
    <line x1="60" y1="400" x2="300" y2="400" stroke="#9ca3af" stroke-width="3"/>
    <text x="48" y="404" text-anchor="end" font-weight="bold">L0</text>
    <text x="180" y="392" text-anchor="middle"><tspan font-weight="bold">reviewed</tspan> — a person read the intent</text>
    <text x="316" y="404" font-size="12" fill="#4b5563">covers: nothing is machine-checked</text>

    <line x1="60" y1="338" x2="300" y2="338" stroke="#9ca3af" stroke-width="3"/>
    <text x="48" y="342" text-anchor="end" font-weight="bold">L1</text>
    <text x="180" y="330" text-anchor="middle"><tspan font-weight="bold">example-tested</tspan> — one scenario</text>
    <text x="316" y="342" font-size="12" fill="#4b5563">covers: that one input</text>

    <line x1="60" y1="276" x2="300" y2="276" stroke="#9ca3af" stroke-width="3"/>
    <text x="48" y="280" text-anchor="end" font-weight="bold">L2</text>
    <text x="180" y="268" text-anchor="middle"><tspan font-weight="bold">property-tested</tspan> — generated inputs</text>
    <text x="316" y="280" font-size="12" fill="#4b5563">covers: many inputs, not all</text>
    <text x="316" y="295" font-size="12" fill="#4b5563">(200 random examples missed a bug)</text>

    <line x1="60" y1="214" x2="300" y2="214" stroke="#9ca3af" stroke-width="3"/>
    <text x="48" y="218" text-anchor="end" font-weight="bold">L3</text>
    <text x="180" y="206" text-anchor="middle"><tspan font-weight="bold">monitored</tspan> — rule over recorded runs</text>
    <text x="316" y="218" font-size="12" fill="#4b5563">covers: every run we have,</text>
    <text x="316" y="233" font-size="12" fill="#4b5563">including other features' runs</text>

    <line x1="60" y1="152" x2="300" y2="152" stroke="#9ca3af" stroke-width="3"/>
    <text x="48" y="156" text-anchor="end" font-weight="bold">L4</text>
    <text x="180" y="144" text-anchor="middle"><tspan font-weight="bold">statically checked</tspan> — the artifact</text>
    <text x="316" y="156" font-size="12" fill="#4b5563">covers: all executions, but only</text>
    <text x="316" y="171" font-size="12" fill="#4b5563">structural facts (types, places)</text>

    <line x1="60" y1="90" x2="300" y2="90" stroke="#9ca3af" stroke-width="3"/>
    <text x="48" y="94" text-anchor="end" font-weight="bold">L5</text>
    <text x="180" y="82" text-anchor="middle"><tspan font-weight="bold">proven</tspan> — solver, all inputs</text>
    <text x="316" y="94" font-size="12" fill="#4b5563">covers: every input in the domain;</text>
    <text x="316" y="109" font-size="12" fill="#4b5563">not whether the function is called</text>
  </g>

  <!-- the comparison (right) -->
  <text x="620" y="36" font-size="15" font-weight="bold">Reached vs required → status → verdict</text>
  <rect x="620" y="52" width="460" height="136" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="636" y="76" font-size="13"><tspan font-weight="bold">reached</tspan> — a fact: what the checker established</text>
  <text x="636" y="96" font-size="13"><tspan font-weight="bold">required</tspan> — a decision: the template's default, or require:</text>
  <text x="636" y="124" font-size="13">check failed → <tspan font-weight="bold" fill="#b91c1c">fail</tspan></text>
  <text x="636" y="142" font-size="13">check passed, reached ≥ required → <tspan font-weight="bold" fill="#15803d">pass</tspan></text>
  <text x="636" y="160" font-size="13">check passed, reached &lt; required → <tspan font-weight="bold" fill="#b45309">gap</tspan></text>
  <text x="636" y="178" font-size="13">(a gap is also: a value no run exercises, a path a rule does not cover)</text>

  <g font-size="13">
    <rect x="620" y="204" width="460" height="56" rx="6" fill="#f0fdf4" stroke="#15803d"/>
    <text x="636" y="226" font-weight="bold">FS-0101/pr_correct</text>
    <text x="636" y="246">review_age_ok reached L5, required L5 → <tspan fill="#15803d" font-weight="bold">pass</tspan> · verdict <tspan font-weight="bold">accepted</tspan></text>

    <rect x="620" y="270" width="460" height="56" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="636" y="292" font-weight="bold">FS-0101/pr_branchy — the same rule written with an if</text>
    <text x="636" y="312">reached L2 (no proof), required L5 → <tspan fill="#b45309" font-weight="bold">gap</tspan> · <tspan font-weight="bold">accepted with gaps</tspan></text>

    <rect x="620" y="336" width="460" height="56" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="636" y="358" font-weight="bold">FS-0101/pr_no_lower_bound</text>
    <text x="636" y="378">counterexample age_days = −1 → <tspan fill="#b91c1c" font-weight="bold">fail</tspan> · verdict <tspan font-weight="bold">rejected</tspan></text>
  </g>

  <rect x="620" y="402" width="460" height="50" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="636" y="424" font-size="13" font-weight="bold">Verdict of a PR</text>
  <text x="636" y="443" font-size="13">any fail → rejected · otherwise any gap → accepted with gaps · else accepted</text>
</svg>
