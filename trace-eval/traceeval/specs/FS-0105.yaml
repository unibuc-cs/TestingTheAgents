id: FS-0105
title: A retried publishing write never duplicates its effect
owner: platform-reliability
intent: |
  Transient failures are retried (at least once). When the acknowledgement of a write made by the
  publishing workflow is lost and the call is retried, the effect happens once: every write tool the
  publishing skill uses is idempotent under its idempotency key. Retrying is the harness's job (one
  place); services honour the key; adapters only pass it through.

clauses:
  - id: retries-on
    kind: setting
    text: transient failures are retried at least once
    key: runtime.retries
    type: integer
    min: 1
    max: 5

  - id: keys-on
    kind: setting
    text: idempotency keys are enabled
    key: runtime.idempotency_keys
    type: boolean
    value: true

  - id: once-per-write
    kind: contract
    text: for every write tool the publishing skill calls (from the product model), a run that loses the acknowledgement still succeeds and audits the write exactly once
    forall: {tool: {skill_write_tools: publishing-workflow}}
    scenario:
      case: "=first_case_calling(tool)"
      fault_profile: "='ack_timeout_once:' + tool"
    ensures: run.passed and audit_count(run, tool) == audit_count(baseline_run(run.test_id), tool)

  - id: keyed-writes
    kind: trace
    text: every successful publishing write carried an idempotency key
    scope: {tools: [publish_page, schedule_publish, unpublish_page, request_review]}
    rule: always
    event: {kind: tool.call, tool: [publish_page, schedule_publish, unpublish_page, request_review], status: ok}
    where: event.idempotency_key is not None

  - id: lost-ack-publish
    kind: example
    text: a lost acknowledgement of publish_page publishes once
    case: PUB-12

  - id: lost-ack-schedule
    kind: example
    text: a lost acknowledgement of schedule_publish schedules once
    case: PUB-09
    fault_profile: ack_timeout_once:schedule_publish
    expect:
      state: [["pages.p4.status", "==", "scheduled"]]
      audit: [{action: schedule_publish, page_id: p4, count: 1}]

  - id: retry-in-one-place
    kind: placement
    text: retrying lives in the harness; adapters neither retry nor swallow transient errors
    rules:
      - define: {function: with_retry, in: harness/retry.py}
      - forbid_name: {name: TransientError, in: [tools]}
      - forbid_name: {name: with_retry, in: [tools, services]}
