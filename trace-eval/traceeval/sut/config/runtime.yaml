# Runtime configuration of the ContentOps agent platform.
runtime:
  max_tool_calls: 12          # step budget of each agent (its own tool calls and delegations)
  max_run_tool_calls: 40      # step budget of the whole request (all agents together)
  retries: 2                 # retries on transient tool failures
  idempotency_keys: true      # reuse the same key on write retries to prevent duplicate actions

tools:
  disabled: []                # tools removed from every agent (feature flags / incidents)
  requires_approval: [approve_review, export_user_data, unpublish_page]

routing:
  default_agent: authoring    # specialist for requests that no specialist owns

publishing:
  require_review: true        # pages need an approved review before publishing
  allow_scheduling: true

seo:
  max_title_length: 60
  require_description: true

translation:
  default_locales: [de-DE, fr-FR]

optimizer:
  max_load_ms: 3000           # a page that loads slower than this is reported as slow
