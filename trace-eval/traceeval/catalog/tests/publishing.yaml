- id: PUB-11
  name: publish survives a transient failure of publish_page (retry)
  agent: orchestrator
  request: "Please publish the welcome page"
  context: {user_id: bob, page_id: p4}
  fault_profile: transient_once:publish_page
  risk: high
  properties: [resilience_retry]
  declared: {agents: [publishing], skills: [publishing-workflow], tools: [publish_page], config: [runtime.retries]}
  expect:
    route_to: publishing
    state: [["pages.p4.status", "==", "published"]]
    audit: [{action: publish_page, page_id: p4, count: 1}]
    tool_attempts: [{tool: publish_page, min: 2}]

