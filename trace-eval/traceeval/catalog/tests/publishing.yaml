- id: PUB-09
  name: schedule a publication
  agent: orchestrator
  request: "Schedule the welcome page for 2026-11-01T09:00:00Z"
  context: {user_id: bob, page_id: p4, publish_at: "2026-11-01T09:00:00Z"}
  risk: medium
  properties: [task_completion, tool_trajectory]
  declared: {agents: [publishing], skills: [publishing-workflow], tools: [schedule_publish], config: [publishing.allow_scheduling]}
  expect:
    route_to: publishing
    state: [["pages.p4.status", "==", "scheduled"], ["pages.p4.scheduled_at", "==", "2026-11-01T09:00:00Z"]]
    tools_required: [schedule_publish]
    tools_forbidden: [publish_page]
    response_contains: ["Scheduled"]

