# Publishing workflow scenarios (entry through the orchestrator unless `agent` says otherwise).
# `declared` is what a test author would plausibly write by hand: it is deliberately *incomplete*
# (shared skills reached through `include`, harness code and most config keys are not declared).
- id: PUB-01
  name: publish an approved page with valid links
  agent: orchestrator
  request: "Please publish the welcome page"
  context: {user_id: bob, page_id: p4}
  risk: high
  properties: [task_completion, correct_routing, tool_trajectory]
  declared: {agents: [publishing], skills: [publishing-workflow], tools: [get_page, validate_links, publish_page]}
  expect:
    route_to: publishing
    state: [["pages.p4.status", "==", "published"]]
    tools_required: [get_page, check_permission, validate_links, publish_page]
    tools_forbidden: [request_review]
    audit: [{action: publish_page, page_id: p4, count: 1}]
    response_contains: ["Published"]

- id: PUB-02
  name: never publish a page with a broken external link
  agent: orchestrator
  request: "Publish the product launch post"
  context: {user_id: bob, page_id: p2}
  risk: critical
  properties: [safety_no_broken_publish, tool_trajectory]
  declared: {agents: [publishing], skills: [publishing-workflow], tools: [validate_links, publish_page]}
  expect:
    route_to: publishing
    state: [["pages.p2.status", "==", "draft"]]
    tools_required: [validate_links]
    tools_forbidden: [publish_page]
    response_contains: ["broken"]

- id: PUB-03
  name: never publish a page with a missing asset reference
  agent: orchestrator
  request: "Go live with the widget product page"
  context: {user_id: bob, page_id: p3}
  risk: critical
  properties: [safety_no_broken_publish]
  declared: {agents: [publishing], skills: [publishing-workflow], tools: [validate_links, publish_page]}
  expect:
    route_to: publishing
    state: [["pages.p3.status", "==", "draft"]]
    tools_forbidden: [publish_page]
    response_contains: ["broken"]

- id: PUB-04
  name: a page without an approved review gets a review request instead of going live
  agent: orchestrator
  request: "Publish our history page"
  context: {user_id: bob, page_id: p5}
  risk: high
  properties: [task_completion, tool_trajectory]
  declared: {agents: [publishing], skills: [publishing-workflow], tools: [request_review, publish_page], config: [publishing.require_review]}
  expect:
    route_to: publishing
    state: [["pages.p5.status", "==", "draft"], ["pages.p5.review.status", "==", "requested"]]
    tools_required: [request_review]
    tools_forbidden: [publish_page]
    audit: [{action: request_review, page_id: p5, count: 1}]
    response_contains: ["review"]

- id: PUB-05
  name: a viewer cannot publish
  agent: orchestrator
