# Dataset-style eval: intent handling inside specialists ("prompt -> expected tool invocation").
# Items call the specialist directly (no orchestrator) and are scored on the tools actually used.
id: DS-INTENTS
name: specialist intent / tool-choice dataset
kind: dataset
risk: medium
properties: [tool_trajectory]
declared: {agents: [publishing, authoring, assets, translation, governance], skills: [publishing-workflow, page-authoring, asset-management, translation, governance-ops]}
items:
  - {id: i01, agent: publishing, request: "Publish the welcome page", context: {user_id: bob, page_id: p4},
     expect: {tools_required: [publish_page], tools_forbidden: [unpublish_page, schedule_publish]}}
  - {id: i02, agent: publishing, request: "Launch the welcome page", context: {user_id: bob, page_id: p4},
     expect: {tools_required: [publish_page]}}
  - {id: i03, agent: publishing, request: "Take down the old news page", context: {user_id: carol, page_id: p7, approval_token: APPR-CAROL-7731},
     expect: {tools_required: [unpublish_page], tools_forbidden: [publish_page, validate_links]}}
  - {id: i04, agent: publishing, request: "Retract the old news page", context: {user_id: carol, page_id: p7, approval_token: APPR-CAROL-7731},
     expect: {tools_required: [unpublish_page]}}
  - {id: i05, agent: publishing, request: "Schedule the welcome page for tomorrow", context: {user_id: bob, page_id: p4, publish_at: "2026-11-03T09:00:00Z"},
     expect: {tools_required: [schedule_publish], tools_forbidden: [publish_page]}}
  - {id: i06, agent: publishing, request: "Schedule the release of the welcome page for later today", context: {user_id: bob, page_id: p4, publish_at: "2026-11-03T18:00:00Z"},
     expect: {tools_required: [schedule_publish]}}
  - {id: i07, agent: authoring, request: "Create a new page for pricing", context: {user_id: alice, parent_path: /content/site, title: Pricing, template: article, body: "Prices.", description: "Prices.", keywords: [pricing]},
     expect: {tools_required: [create_page, set_page_metadata], tools_forbidden: []}}
  - {id: i08, agent: authoring, request: "Fix the body of the welcome post", context: {user_id: alice, page_id: p4, body: "Fixed."},
     expect: {tools_required: [update_page_content], tools_forbidden: [create_page, set_page_metadata]}}
  - {id: i09, agent: authoring, request: "Replace the text of the home page", context: {user_id: bob, page_id: p1, body: "New home."},
     expect: {tools_required: [update_page_content, validate_links], tools_forbidden: [create_page]}}
  - {id: i10, agent: authoring, request: "Add a draft page for careers", context: {user_id: alice, parent_path: /content/site, title: Careers, template: landing, body: "Jobs.", description: "Jobs.", keywords: [jobs]},
     expect: {tools_required: [create_page]}}
  - {id: i11, agent: assets, request: "Attach the hero image to the welcome post", context: {user_id: alice, page_id: p4, asset_id: a1},
     expect: {tools_required: [attach_asset], tools_forbidden: [upload_asset]}}
  - {id: i12, agent: assets, request: "Upload a new photo cover.jpg and attach it to the welcome post", context: {user_id: alice, page_id: p4, asset_name: cover.jpg, folder: /content/dam/site, mime: image/jpeg},
     expect: {tools_required: [upload_asset, attach_asset]}}
  - {id: i13, agent: assets, request: "Insert the brochure into the widget page", context: {user_id: bob, page_id: p3, asset_id: a2},
     expect: {tools_required: [attach_asset], tools_forbidden: [upload_asset]}}
  - {id: i14, agent: translation, request: "Translate the welcome post into German", context: {user_id: alice, page_id: p4, locales: [de-DE]},
     expect: {tools_required: [create_translation_job], tools_forbidden: [get_translation_status]}}
  - {id: i15, agent: translation, request: "How far is translation job tj-1?", context: {user_id: alice, job_id: tj-1},
     fixture_patch: {translation_jobs.tj-1: {page_id: p1, locales: [fr-FR], status: in_progress, requested_by: alice}},
     expect: {tools_required: [get_translation_status], tools_forbidden: [create_translation_job]}}
  - {id: i16, agent: translation, request: "Localise the home page", context: {user_id: bob, page_id: p1},
     expect: {tools_required: [create_translation_job]}}
  - {id: i17, agent: governance, request: "Export the records of subject s1", context: {user_id: carol, subject_id: s1, approval_token: APPR-CAROL-7731},
     expect: {tools_required: [check_consent, export_user_data]}}
  - {id: i18, agent: governance, request: "Show the audit log of the home page", context: {user_id: alice, page_id: p1},
     expect: {tools_required: [get_audit_log], tools_forbidden: [check_consent, export_user_data]}}
  - {id: i19, agent: governance, request: "Who changed the widget page?", context: {user_id: alice, page_id: p3},
     expect: {tools_required: [get_audit_log], tools_forbidden: [export_user_data]}}
  - {id: i20, agent: governance, request: "GDPR access request for subject s2", context: {user_id: carol, subject_id: s2, approval_token: APPR-CAROL-7731},
     expect: {tools_required: [check_consent], tools_forbidden: [export_user_data]}}
  - {id: i21, agent: publishing, request: "Publish the product launch post", context: {user_id: bob, page_id: p2},
     expect: {tools_required: [validate_links], tools_forbidden: [publish_page]}}
  - {id: i22, agent: publishing, request: "Publish our history page", context: {user_id: bob, page_id: p5},
     expect: {tools_required: [request_review], tools_forbidden: [publish_page]}}
  - {id: i23, agent: authoring, request: "Update the welcome post", context: {user_id: dave, page_id: p4, body: "x"},
     expect: {tools_required: [check_permission], tools_forbidden: [update_page_content]}}
  - {id: i24, agent: assets, request: "Attach the hero image to the home page", context: {user_id: dave, page_id: p1, asset_id: a1},
     expect: {tools_required: [check_permission], tools_forbidden: [attach_asset]}}
